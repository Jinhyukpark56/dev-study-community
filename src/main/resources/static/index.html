<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="개발 공부 중 생긴 질문과 학습 기록을 나누는 커뮤니티">
    <title>개발 공부 커뮤니티</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="#" aria-label="게시글 목록으로 이동">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span>
            <strong>개발 공부 커뮤니티</strong>
            <small>질문과 학습 기록을 함께 나눠요</small>
        </span>
    </a>

    <div class="session-area">
        <span id="session-label" class="session-label">로그인 상태 확인 중</span>
        <button id="show-auth-button" class="button button-quiet" type="button">로그인 · 회원가입</button>
        <button id="logout-button" class="button button-quiet" type="button" hidden>로그아웃</button>
    </div>
</header>

<main class="page-shell">
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <section id="auth-panel" class="panel auth-panel" aria-labelledby="auth-heading" hidden>
        <div class="section-heading">
            <div>
                <p class="eyebrow">계정</p>
                <h1 id="auth-heading">로그인 또는 회원가입</h1>
            </div>
            <button id="close-auth-button" class="icon-button" type="button" aria-label="계정 창 닫기">×</button>
        </div>

        <div class="auth-grid">
            <form id="login-form" class="form-card">
                <h2>로그인</h2>
                <label>
                    이메일
                    <input name="email" type="email" autocomplete="email" maxlength="254" required>
                </label>
                <label>
                    비밀번호
                    <input name="password" type="password" autocomplete="current-password" minlength="15" required>
                </label>
                <button class="button button-primary" type="submit">로그인</button>
            </form>

            <form id="register-form" class="form-card">
                <h2>회원가입</h2>
                <label>
                    이메일
                    <input name="email" type="email" autocomplete="email" maxlength="254" required>
                </label>
                <label>
                    비밀번호
                    <input name="password" type="password" autocomplete="new-password" minlength="15" required>
                </label>
                <p class="field-help">15자 이상, UTF-8 기준 72바이트 이하로 입력해 주세요.</p>
                <button class="button button-secondary" type="submit">계정 만들기</button>
            </form>
        </div>
    </section>

    <section id="list-view" aria-labelledby="list-heading">
        <div class="hero">
            <div>
                <p class="eyebrow">최근 게시글</p>
                <h1 id="list-heading">함께 배우고 기록해요</h1>
                <p>궁금한 내용을 질문하거나 오늘 배운 내용을 남겨 보세요.</p>
            </div>
            <button id="create-post-button" class="button button-primary" type="button" hidden>새 글 작성</button>
        </div>

        <div class="panel filter-bar">
            <form id="tag-filter-form" class="inline-form">
                <label for="tag-filter">태그로 찾기</label>
                <input id="tag-filter" name="tag" type="text" maxlength="50" placeholder="예: Java">
                <button class="button button-secondary" type="submit">적용</button>
                <button id="clear-tag-button" class="button button-quiet" type="button">전체 보기</button>
            </form>
            <p id="result-summary" class="result-summary"></p>
        </div>

        <div id="post-list" class="post-list" aria-live="polite"></div>

        <nav class="pagination" aria-label="게시글 페이지 이동">
            <button id="previous-page-button" class="button button-quiet" type="button">이전</button>
            <span id="page-label">1 / 1 페이지</span>
            <button id="next-page-button" class="button button-quiet" type="button">다음</button>
        </nav>
    </section>

    <section id="editor-view" class="panel narrow-panel" aria-labelledby="editor-heading" hidden>
        <div class="section-heading">
            <div>
                <p class="eyebrow">게시글</p>
                <h1 id="editor-heading">새 글 작성</h1>
            </div>
            <button class="back-to-list button button-quiet" type="button">목록으로</button>
        </div>

        <form id="post-form" class="stacked-form">
            <label>
                글 유형
                <select name="type">
                    <option value="QUESTION">질문</option>
                    <option value="STUDY_LOG">학습 기록</option>
                </select>
            </label>
            <label>
                제목
                <input name="title" type="text" maxlength="100" required>
            </label>
            <label>
                본문
                <textarea name="content" rows="12" maxlength="1000" required></textarea>
            </label>
            <label>
                태그
                <input name="tags" type="text" maxlength="158" placeholder="Java, Spring, JPA">
            </label>
            <p class="field-help">쉼표로 구분해 최대 3개까지 입력해 주세요. 이미 있는 이름은 같은 태그로 연결됩니다.</p>
            <div class="form-actions">
                <button class="button button-primary" type="submit">저장</button>
                <button class="back-to-list button button-quiet" type="button">취소</button>
            </div>
        </form>
    </section>

    <section id="detail-view" aria-labelledby="detail-title" hidden>
        <div class="detail-toolbar">
            <button class="back-to-list button button-quiet" type="button">← 목록으로</button>
            <div id="post-actions" class="action-row" hidden>
                <button id="edit-post-button" class="button button-secondary" type="button">수정</button>
                <button id="delete-post-button" class="button button-danger" type="button">삭제</button>
            </div>
        </div>

        <article class="panel post-detail">
            <div class="post-meta">
                <span id="detail-type" class="type-badge"></span>
                <span id="detail-date"></span>
                <span id="detail-author"></span>
            </div>
            <h1 id="detail-title"></h1>
            <div id="detail-tags" class="tag-list"></div>
            <p id="detail-content" class="post-content"></p>
        </article>

        <section class="panel comments-panel" aria-labelledby="comments-heading">
            <div class="section-heading compact">
                <h2 id="comments-heading">댓글</h2>
                <span id="comment-count" class="muted"></span>
            </div>

            <form id="comment-form" class="comment-form" hidden>
                <label class="sr-only" for="comment-content">댓글 내용</label>
                <textarea id="comment-content" name="content" rows="3" maxlength="1000" placeholder="댓글을 입력해 주세요" required></textarea>
                <button class="button button-primary" type="submit">댓글 작성</button>
            </form>
            <p id="comment-login-guide" class="login-guide">댓글을 작성하려면 로그인해 주세요.</p>

            <div id="comment-list" class="comment-list"></div>
        </section>
    </section>
</main>

<footer class="site-footer">
    <p>dev-study-community v0.1</p>
</footer>

<noscript>이 화면을 사용하려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
<script src="/app.js" defer></script>
</body>
</html>
